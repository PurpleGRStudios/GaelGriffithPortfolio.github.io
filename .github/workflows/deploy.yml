name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          # User/org site (<owner>.github.io) is served from "/", any other repo from "/<repo>/"
          if [ "${GITHUB_REPOSITORY,,}" = "${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then
            export VITE_BASE=/
          else
            export VITE_BASE=/${GITHUB_REPOSITORY#*/}/
          fi
          echo "Building with base $VITE_BASE"
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
